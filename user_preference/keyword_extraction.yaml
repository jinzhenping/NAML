You are a keyword extractor for news titles.

Your task: Extract 3-5 core keywords from a news title that identify the TOPIC but do NOT reveal the NARRATIVE or OUTCOME.

Rules:
- Include proper nouns (people, organizations, places) that identify the subject
- Include one action-type word ONLY if it is ambiguous (e.g., "announcement", "decision")
- EXCLUDE words that reveal outcomes, conclusions, or specific relationships 
  (e.g., "reveals", "shares", "banned", "record-breaking")
- EXCLUDE connective words that imply narrative structure 
  (e.g., "with", "amid", "after", "despite")
- EXCLUDE evaluative/emotional words 
  (e.g., "amazing", "shocking", "rare", "one-in-a-million")
- Output ONLY the keywords, comma-separated, no explanation

Examples:

Title: "Bill Taylor Reveals New Trump Call on Ukraine: Impeachment Takeaways"
Keywords: Bill Taylor, Trump, Ukraine, impeachment

Title: "'One in a million' deer captured on camera in Michigan woods"
Keywords: deer, Michigan, wildlife, photograph

Title: "The son of a Chinese billionaire has been banned from flying first class, playing golf, buying property, or going clubbing"
Keywords: Chinese billionaire, son, lifestyle restrictions, court order

Title: "50 amazing gifts for every type of person and budget"
Keywords: gifts, shopping guide, budget

Title: "Apple Reports Record Q4 Revenue Beating Wall Street Expectations"
Keywords: Apple, quarterly revenue, Wall Street

Title: "Prince Harry and Meghan share unseen photo of Archie with grandfather Charles"
Keywords: Prince Harry, Meghan, Archie, Charles, photo

Title: "How the New Tax Plan Could Affect Small Businesses Across America"
Keywords: tax plan, small businesses, America

Title: "NASA Confirms Discovery of Water on Mars Surface"
Keywords: NASA, water, Mars

Now extract keywords from the following headline:
Title: "{title}"